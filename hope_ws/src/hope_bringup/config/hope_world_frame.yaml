hope_world:
  # Frame names published as static transforms by hope_world.launch.py.
  frames:
    world: world
    table_center: table_center
    robot_half_center: robot_half_center
    opponent_half_center: opponent_half_center
    net_center: net_center
    floor_origin: floor_origin
    virtual_hit_plane: virtual_hit_plane

  # ITTF regulation table dimensions (m). World frame: +x forward (toward the
  # opponent), +y left, +z up; z = 0 at the table surface; origin at the
  # near-side left table corner, so the table occupies x in [0, length],
  # y in [-width, 0].
  table_m:
    length: 2.74
    width: 1.525
    surface_height: 0.76
    net_height: 0.1525

  landmarks_m:
    table_center: [1.37, -0.7625, 0.0]
    robot_half_center: [0.685, -0.7625, 0.0]
    opponent_half_center: [2.055, -0.7625, 0.0]
    net_center: [1.37, -0.7625, 0.0]
    floor_origin: [0.0, 0.0, -0.76]

  planner:
    # Fixed virtual hit-plane x (m); publish it as a frame for visualization.
    x_hit: 0.0

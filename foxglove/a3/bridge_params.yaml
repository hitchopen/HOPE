/**:
  ros__parameters:
    port: 8765
    address: "0.0.0.0"
    tls: false
    # Whitelist keeps camera H.265 / lidar off the Wi-Fi link by default.
    topic_whitelist:
      - "^/tf$"
      - "^/tf_static$"
      - "^/joint_states$"
      - "^/hope/.*"
      - "^/agivslam/localization/odometry$"
    # Expose only the five audited HOPE state transitions. E-stop can assert
    # but never clear the vendor latch; the other four use runner acknowledgments.
    service_whitelist:
      - "^/hope/safety/trigger_estop$"
      - "^/hope/control/enter_prepare$"
      - "^/hope/control/enter_policy$"
      - "^/hope/control/exit_policy$"
      - "^/hope/control/enter_passive$"
    param_whitelist: ["(?!)"]
    client_topic_whitelist: ["(?!)"]
    send_buffer_limit: 10000000
    num_threads: 0
    use_compression: false
    capabilities:
      - services
      - connectionGraph

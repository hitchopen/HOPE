hope_world:
  contract:
    id: table_p1_to_p2_v1
    description: Canonical table frame shared by planner, policy and deployment.
    handedness: right_handed
    x_axis: P1_to_P2
    y_axis: completes_right_handed_frame
    z_axis: up
    quaternion_order: wxyz
    quaternion_algebra: hamilton
    base_link: pelvis_link
    # Operator confirmed the near-left table origin, with Motive +X left.
    # The driver converts the complete world stream to this canonical frame.
    venue_calibrated: true
    calibration_sha256: 57f596207b527764e7b6e1ddae26b44d14b3cfb3262f602361ff8ec8172ebf70
    calibration_note: >-
      Operator confirmed Motive +X left, +Z up, near-left table-surface origin.
      Apply the fixed +90-degree Z rotation below to the entire Motive stream.
      Receipt: hope_ws/calibration_receipts/motive_world_axes_20261010.json

  # Applied once by the NatNet ROS driver, before P1/P2 table-side conversion.
  motive_to_world:
    yaw_degrees: 90.0
    translation_m: [0.0, 0.0, 0.0]

  frames:
    world: world
    table_rigid_body: PPT
    p1_mocap: UCB_P1
    p1_base_link: UCB_P1_base_link
    p2_mocap: UCB_P2
    p2_base_link: UCB_P2_base_link
    table_center: table_center
    p1_half_center: p1_half_center
    p2_half_center: p2_half_center
    net_center: net_center
    floor_origin: floor_origin
    virtual_hit_plane: virtual_hit_plane

  table_m:
    length: 2.74
    width: 1.525
    surface_height: 0.76
    net_height: 0.1525

  runtime_table_sides:
    P1:
      tracked_marker_frame: UCB_P1
      operation: identity
      note: Driver output is canonical after motive_to_world; no further P1 rotation.
    P2:
      tracked_marker_frame: UCB_P2
      operation: rotate_z_pi_about_table_center
      position_equation: ["x'=length-x", "y'=-width-y", "z'=z"]
      note: >-
        Apply to every relayed ball and rigid-body pose before packetization or
        base composition; never switch while the lifecycle is running.

  landmarks_m:
    table_center: [1.37, -0.7625, 0.0]
    p1_half_center: [0.685, -0.7625, 0.0]
    p2_half_center: [2.055, -0.7625, 0.0]
    net_center: [1.37, -0.7625, 0.0]
    floor_origin: [0.0, 0.0, -0.76]

  planner:
    x_hit: 0.0
    # Motive/table-surface z=0 -> policy/floor z=0. Apply exactly once.
    policy_z_offset: 0.76

  mocap_to_base_link:
    # The default OptiTrack launch accepts the current named Motive body and
    # assumes its nominal identity extrinsic, without a file or layout pin.
    # Static YAML values do not approve a physical installation.
    # Legacy calibration mode still requires its separate measured receipt.
    p1:
      marker_layout_id: A3_marker_shell_v3_stickers_12mm
      calibrated: false
      calibration_sha256: ""
      xyz_m: [0.0, 0.0, 0.0]
      quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
      note: >-
        Import a pelvis-aligned UCB_P1 asset with Streaming Up Axis Z.
        Default motive_live mode accepts its current definition without a
        fixed SHA-256, marker count or layout. Preserve the imported pivot
        and axes; no former pivot offset or extra pose-axis rotation is applied.
    p2:
      marker_layout_id: unknown
      calibrated: false
      calibration_sha256: ""
      xyz_m: [0.0, 0.0, 0.0]
      quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
      note: Not measured.

  provenance:
    cad:
      path: agibot/mocap_sticker_shell_v3/documents/marker_transforms_pelvis_link_stickers.csv
      sha256: 5c0e9ed20497453026d07e877711ef2a184c7b27098525a2b6c3fc6468b150a0
      format: CSV_ROS_pelvis_link_metres_sticker_optical_centres
    urdf:
      path: agibot/URDF/A3T2.5-URDF-std-pingpang/urdf/URDF-JOINT-LINK.urdf
      sha256: 0d83529cf808e2e68036f8168bd8b7a1c9a97d9c536eb9a14981ea4105d6b9ae
      root_link: pelvis_link
    pelvis_mesh:
      path: agibot/URDF/A3T2.5-URDF-std-pingpang/meshes/pelvis_link.STL
      sha256: 162899b2ba775cbdff24a7ded7908b057aae559326715eae7d6aee220578907f
    cad_shell_to_urdf_pelvis_candidate:
      # Published CAD-mm to pelvis_link-m registration used by the v3 table.
      # Already applied to the CSV; never apply it again during calibration.
      runtime_usable: false
      quaternion_wxyz: [0.5, 0.5, 0.5, 0.5]
      translation_m: [0.0, 0.0, -0.145800095037096]
      limitation: Does not determine the Motive rigid-body pivot or axes.

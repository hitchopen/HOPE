hope_world:
  contract:
    id: table_p1_to_p2_v1
    description: Canonical table frame shared by planner, policy and deployment.
    handedness: right_handed
    x_axis: P1_to_P2
    y_axis: completes_right_handed_frame
    z_axis: up
    quaternion_order: wxyz
    quaternion_algebra: hamilton
    base_link: pelvis_link
    # Geometry defines the canonical frame. This venue uses Motive's manually
    # aligned near-left table-surface origin; PPT is not a runtime dependency.
    venue_calibrated: true
    calibration_sha256: 23c3d8651c696c4f49d192d6cd246bbd393054ffc540163d6b7fdd92eff369f2
    calibration_note: >-
      Operator-attested manual Motive origin (+X P1-to-P2, +Y left, +Z up)
      with a grounded Ball/P1 vertical probe; no PPT required. Receipt:
      hope_ws/calibration_receipts/manual_motive_world_origin_20260731.json

  frames:
    world: world
    table_rigid_body: PPT
    p1_mocap: P1
    p1_base_link: P1_base_link
    p2_mocap: P2
    p2_base_link: P2_base_link
    table_center: table_center
    p1_half_center: p1_half_center
    p2_half_center: p2_half_center
    net_center: net_center
    floor_origin: floor_origin
    virtual_hit_plane: virtual_hit_plane

  table_m:
    length: 2.74
    width: 1.525
    surface_height: 0.76
    net_height: 0.1525

  landmarks_m:
    table_center: [1.37, -0.7625, 0.0]
    p1_half_center: [0.685, -0.7625, 0.0]
    p2_half_center: [2.055, -0.7625, 0.0]
    net_center: [1.37, -0.7625, 0.0]
    floor_origin: [0.0, 0.0, -0.76]

  planner:
    x_hit: 0.0
    # Motive/table-surface z=0 -> policy/floor z=0. Apply exactly once.
    policy_z_offset: 0.76

  mocap_to_base_link:
    # T_marker_base for each Motive rigid-body asset. CAD constrains the
    # shell-to-pelvis transform, but Motive's pivot and axes are configurable.
    # The operational transform must therefore come from a Motive asset export
    # plus a fresh v3 sticker live-calibration receipt.
    #
    # Zero values below are inert placeholders, never an identity assertion.
    p1:
      marker_layout_id: A3_marker_shell_v3_stickers_12mm
      calibrated: false
      calibration_sha256: ""
      xyz_m: [0.0, 0.0, 0.0]
      quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
      note: >-
        Uncalibrated after the v3 sticker-shell migration. Do not reuse the
        historical ten-ball receipt. Restart NatNet after redefining P1 with
        S01-S24, then generate a fresh approved marker-CAD receipt at
        calibration/p1_to_pelvis.json. Runtime loads that file; these values
        are inert placeholders, not an assertion that P1 equals pelvis_link.
    p2:
      marker_layout_id: unknown
      calibrated: false
      calibration_sha256: ""
      xyz_m: [0.0, 0.0, 0.0]
      quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
      note: Not measured.

  provenance:
    cad:
      path: agibot/mocap_sticker_shell_v3/documents/marker_transforms_pelvis_link_stickers.csv
      sha256: 3b304f521b85ebac8c8595d1666322ef3c64f9dcd40ffa0d339da25b431bdb90
      format: CSV_ROS_pelvis_link_metres_sticker_optical_centres
    urdf:
      path: agibot/URDF/A3T2.5-URDF-std-pingpang/urdf/URDF-JOINT-LINK.urdf
      sha256: 0d83529cf808e2e68036f8168bd8b7a1c9a97d9c536eb9a14981ea4105d6b9ae
      root_link: pelvis_link
    pelvis_mesh:
      path: agibot/URDF/A3T2.5-URDF-std-pingpang/meshes/pelvis_link.STL
      sha256: 162899b2ba775cbdff24a7ded7908b057aae559326715eae7d6aee220578907f
    cad_shell_to_urdf_pelvis_candidate:
      # Published CAD-mm to pelvis_link-m registration used by the v3 table.
      # Already applied to the CSV; never apply it again during calibration.
      runtime_usable: false
      quaternion_wxyz: [0.5, 0.5, 0.5, 0.5]
      translation_m: [0.0, 0.0, -0.145800095037096]
      limitation: Does not determine the Motive rigid-body pivot or axes.

# =============================================================================
# PPO hyperparameters for the HOPE Agibot A3 task (rsl_rl).
#
# Selected on the command line with `algo=ppo`:
#   python scripts/train.py task=HOPEPingPong algo=ppo headless=true
#
# This file is the single source of truth for the PPO settings: both the Hydra
# `scripts/train.py` and the gym task's runner cfg (agents/ppo.py) read it via
# `whole_body_tracking.utils.ppo_cfg`. Edit the values here to tune.
# =============================================================================

name: ppo

runner:
  # ---- training schedule (EDIT) -------------------------------------------
  num_steps_per_env: 24        # rollout length per env before each PPO update
  max_iterations: 50000        # total PPO iterations (the user can override on the CLI)
  # -------------------------------------------------------------------------
  save_interval: 500           # write a periodic local checkpoint every N iterations
  # The observation fed to the policy is RAW (no normalization) — see the policy manifest
  # (`observation_normalization: none`) and PLANNER/POLICY interface docs. Keep this false so the
  # exported ONNX is a direct obs -> action graph that the deployment backend can feed raw obs.
  empirical_normalization: false

policy:
  # ---- actor / critic networks (EDIT) -------------------------------------
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  activation: elu              # elu, relu, tanh, leaky_relu, gelu, selu
  init_noise_std: 1.0          # initial action exploration std
  # -------------------------------------------------------------------------

algorithm:
  # ---- optimization (EDIT) ------------------------------------------------
  learning_rate: 0.001         # initial LR
  schedule: adaptive           # "adaptive" (KL-based) or "fixed"
  desired_kl: 0.01             # target KL for the adaptive schedule
  entropy_coef: 0.01           # exploration bonus
  num_learning_epochs: 5       # gradient epochs per update
  num_mini_batches: 4          # minibatches per epoch
  # -------------------------------------------------------------------------
  gamma: 0.99                  # discount
  lam: 0.95                    # GAE lambda
  clip_param: 0.2              # PPO clip range
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  max_grad_norm: 1.0

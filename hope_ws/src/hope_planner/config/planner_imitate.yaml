planner_imitate:
  ros__parameters:
    # --- bring-up staging ---
    level: 0                 # 0=stand, 1=fh slow, 2=fh, 3=bh slow, 4=bh, 5=alternate fh/bh
    dry_run: true            # true => log only, publish NOTHING (safe default)

    # --- frame ---
    # "base_link" = robot-relative (x fwd, y left, z above floor); the frame model_15200
    #               was validated in. DEFAULT. Needs no robot world pose.
    # "world"     = HOPE table frame; faithful drop-in for the real planner but needs the
    #               (currently UNMEASURED) robot world pose below.
    frame_id: "base_link"
    robot_world_xyz: [0.0, 0.0, 0.0]   # robot base in HOPE world (TODO: measure; only used if frame_id=world)
    robot_world_yaw: 0.0               # robot heading in HOPE world (rad)

    # --- timing ---
    publish_rate_hz: 50.0    # command/update rate (match the controller's input rate)
    strike_period_s: 3.0     # seconds per fake strike; time_to_strike counts this -> 0

    # --- target presets (model_15200 validated distribution) ---
    normal_speed: 2.5        # m/s target paddle speed for levels 2,4,5 (2.3-2.8 trained)
    slow_speed: 1.0          # m/s target paddle speed for the slow levels 1,3
    elevation_deg: 18.0      # forward+up tilt of target velocity/normal

    # --- safety ---
    max_speed: 3.0           # m/s hard ceiling on target paddle speed
    max_pos_step: 0.50       # m, max target-position change per published cycle (slew limit)
    backhand_disabled: false # set true to hard-disable backhand swings during early bring-up
    estop_topic: "/hope/estop"   # std_msgs/Bool; true => command STAND

    # --- logging / viz ---
    csv_path: ""             # e.g. "/tmp/planner_imitate.csv"; "" disables CSV
    publish_markers: true    # RViz MarkerArray on /planner_imitate/markers

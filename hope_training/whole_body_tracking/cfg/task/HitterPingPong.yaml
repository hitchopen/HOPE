  # release condition and no regression/backoff stage.
  ability_curriculum_mode: one_way_strike_gate_v1
  ability_min_exact_samples_per_side: 50.0
  ability_min_completion_per_side: 0.55
  ability_min_position_pass_per_side: 0.15
  ability_min_composite: 0.03
  ability_max_post_fall: 0.10

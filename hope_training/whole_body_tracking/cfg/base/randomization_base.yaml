# Shared domain randomization, composed into tasks via `defaults: [/base/randomization_base@_here_]`.
# Friction / CoM / external pushes / observation noise are always-on in the env cfg; these are the
# extra knobs the trainer applies. Set a range to null to disable that randomization.
domain_rand:
  link_mass_range: [0.85, 1.15]   # +/-15%, randomize_rigid_body_mass (scale)
  pd_gain_range: [0.8, 1.2]       # +/-20%, randomize_actuator_gains (scale); null disables
                                  # (HITTER keeps PD fixed -> set to null to match the paper)

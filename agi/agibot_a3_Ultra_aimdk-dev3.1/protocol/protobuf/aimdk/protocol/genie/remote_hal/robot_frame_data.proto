message PointPose {
  // 四元数旋转（不压缩）
  message Quaternion {
    optional float x = 1;
    optional float y = 2;
    optional float z = 3;
    optional float w = 4;
  }
  // 3D坐标向量
  message Vector3 {
    optional float x = 1;
    optional float y = 2;
    optional float z = 3;
  }
  optional Vector3 position = 1;              // 三维空间位置
  optional Quaternion quaternion = 2; // 四元数旋转（不压缩版本）
  optional uint32 quaternion_compressed = 3;  // 四元数旋转（压缩版本）
}

// 单个关节数据
message Joint {
  optional joint_code_types joint_code = 1;   // 关节代号（内部映射表ID）
  optional PointPose point_pose = 2;
}

// 输入设备数据
message DeviceInputData {
 enum DeviceType {
    DEVICE_LEFT = 0;  // 左侧设备，对应值 0
    DEVICE_RIGHT = 1; // 右侧设备，对应值 1
    DEVICE_HEAD = 2; // 头戴设备，对应值 2
 }
  optional DeviceType device_type = 1;                 // 设备ID
  optional bool axis_click = 2;                         // 摇杆按压状态
  optional float axis_x = 3;                            // 摇杆X轴值 [-1.0, 1.0]
  optional float axis_y = 4;                            // 摇杆Y轴值 [-1.0, 1.0]
  optional float index_trig = 5;                        // 食指扳机 [0.0, 1.0]
  optional float hand_trig = 6;                         // 手掌扳机 [0.0, 1.0]
  optional bool key_one = 7;                            // 功能键1
  optional bool key_two = 8;                            // 功能键2
  optional PointPose point_pose = 9;
}

// 完整的帧数据包
message RobotFrameData {
  message Vector3 {
    optional float x = 1;
    optional float y = 2;
    optional float z = 3;
  }
  optional uint64 timestamp = 1;                      // 时间戳（毫秒）
  optional uint64 frame_index = 2;                     // 帧索引
  repeated Joint left_hand = 100;                       // 左手关节数据
  repeated Joint right_hand = 101;                      // 右手关节数据
  repeated Joint body_data = 102;                       // 身体骨骼数据
  repeated DeviceInputData device_inputs = 103;   // 原始输入设备数据
  optional Vector3 chassis_movement = 104;  // 底盘移动控制向量 [-1.0, 1.0] (x: +前进/-后退, y: +左移/-右移, z: +右转/-左转)
}

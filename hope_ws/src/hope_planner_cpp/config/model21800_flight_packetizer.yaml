hope_ball_flight_packetizer:
  ros__parameters:
    input_pose_topic: "/poses"
    flight_packet_topic: "/ball/flight_packet"
    ball_pose_index: 0
    input_qos_depth: 64

    # Laptop retains the complete source-time-causal 180 ms history. Once the
    # estimator has enough data, it freezes immutable full-window revisions at
    # about 30 Hz and also emits a final revision at net crossing + 50 ms.
    flight_window_s: 0.18
    net_x: 1.37
    post_net_commit_delay_s: 0.05
    rolling_snapshots_enabled: true
    rolling_snapshot_period_s: 0.033
    rolling_snapshot_min_span_s: 0.08
    rolling_snapshot_min_samples: 12
    incoming_opponent_side_margin_m: 0.05
    incoming_speed_threshold_mps: 0.25
    outgoing_speed_threshold_mps: 0.25
    incoming_direction_fit_samples: 4
    incoming_direction_confirmations: 2
    incoming_pre_roll_samples: 24
    incoming_source_gap_reset_s: 0.25

    # Each content-addressed revision is sent at t+0/5/15 ms. HDU deduplicates
    # retries by flight identity + snapshot_sequence + payload hash.
    retransmit_delays_ms: [0, 5, 15]
    session_id: ""
    producer_instance_id: ""
    debug_csv_path: ""

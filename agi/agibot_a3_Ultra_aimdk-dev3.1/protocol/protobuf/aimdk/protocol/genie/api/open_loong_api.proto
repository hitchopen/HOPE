syntax = "proto3";

package aimdk.protocol;

import "aimdk/protocol/common/common.proto";

// ============================================
// 本地终端接入服务
// 基于 open_loong_server.py 的 HTTP 接口设计
// ============================================

service LocalTerminalService {
  // 任务管理接口
  rpc GetAllTasks(DcTaskListRequest) returns (DcTaskListResponse);
  rpc GetTask(GetDcTaskRequest) returns (DcTaskInfoResponse);
  rpc DeleteTask(DeleteDcTaskRequest) returns (CommonResponse);
  rpc CreateTask(CreateDcTaskRequest) returns (CreateDcTaskResponse);
  rpc SaveTask(SaveTaskRequest) returns (CommonResponse);
  rpc StopTask(StopTaskRequest) returns (CommonResponse);
  
  // 机器信息接口
  rpc GetMachineInfo(MachineInfoRequest) returns (MachineInfoResponse);
  rpc GetCameraInfos(CameraInfosRequest) returns (CameraInfosResponse);
  
  // 上传管理接口
  rpc GetUploadStatus(UploadStatusRequest) returns (UploadStatusResponse);
  rpc GetUploadTaskStatus(GetUploadTaskStatusRequest) returns (UploadTaskStatusResponse);
  rpc StopUploadTask(StopUploadTaskRequest) returns (CommonResponse);

  // 预览流接口
  rpc StartPreviewStream(StartPreviewRequest) returns (CommonResponse);
  rpc StopPreviewStream(StopPreviewRequest) returns (CommonResponse);
  
  // 状态流推送（WebSocket替代）
  // rpc SubscribeStatusStream(google.protobuf.Empty) returns (stream StatusUpdate);
  // rpc SubscribeCameraStream(CameraStreamRequest) returns (stream CameraFrame);

  // 初始姿态管理接口
  // POST /pose/set
  rpc SetDcInitialPose(SetDcInitialPoseRequest) returns (CommonResponse);
  // GET /pose/get
  rpc GetDcInitialPose(GetDcInitialPoseRequest) returns (GetDcInitialPoseResponse);
  // POST /pose/reset
  rpc ResetDcInitialPose(ResetDcInitialPoseRequest) returns (ResetDcInitialPoseResponse);
}

// ============================================
// 任务相关消息
// ============================================

// 任务状态枚举
enum TaskState {
  TASK_STATE_UNKNOWN = 0;
  TASK_STATE_INIT = 1;       // 空闲状态
  TASK_STATE_RECORDING = 2;  // 录制中
  TASK_STATE_STOPPED = 3;    // 已停止
  TASK_STATE_UPLOADING = 4;  // 上传中
  TASK_STATE_UPLOADED = 5;   // 已上传
  TASK_STATE_ERROR = 6;      // 错误状态
}

// 状态更新消息
message StateUpdate {
  string task_id = 1;
  TaskState task_state = 2;
}

// 有效性校验信息
message Integrity {
  bool integrity = 1;
  string reasons = 2;
}

// 任务元信息
message TaskMetaInfo {
  Integrity integrity = 1;
  uint64 file_size = 2;
  double file_duration = 3;
}

// 任务基础信息
message TaskBasicInfo {
  string task_id = 1;
  TaskState task_state = 2;
  string temp_folder = 3;   // 临时文件夹路径
  string data_folder = 4;   // 数据文件夹路径
  TaskMetaInfo meta_info = 5;
}

// 获取任务列表请求
message DcTaskListRequest {
  RequestHeader header = 1;
}

// 获取任务列表响应
message DcTaskListResponse {
  ResponseHeader header = 1;
  repeated TaskBasicInfo tasks = 2;
}

// 获取任务详情请求
message GetDcTaskRequest {
  RequestHeader header = 1;
  string task_id = 2;
}

// 获取任务详情响应
message DcTaskInfoResponse {
  ResponseHeader header = 1;
  string task_id = 2;
  TaskState task_state = 3;
  string path = 4;          // 数据路径
  TaskMetaInfo meta_info = 5;
  bool async_upload = 6;    // 是否异步上传
}

// 删除任务请求
message DeleteDcTaskRequest {
  RequestHeader header = 1;
  string task_id = 2;
}

// 创建任务请求
message CreateDcTaskRequest {
  RequestHeader header = 1;
  int32 task_duration = 2;  // 任务持续时间（秒），0表示无限制
}

// 创建任务响应
message CreateDcTaskResponse {
  ResponseHeader header = 1;
  string task_id = 2;
}

// Episode信息
message EpisodeInfo {
  string episode_id = 1;
  string task_type = 2;
  string task_id = 3;
  string job_id = 4;
}

// 上传密钥信息，可以为空
message UploadKey {
  string type = 1;
  string provider = 2;
  string access_key_id = 3;
  string secret_access_key = 4;
  string endpoint = 5;
  string region = 6;
  bool force_path_style = 7;
  bool disable_http2 = 8;
  int32 list_version = 9;
}

// 保存任务请求
message SaveTaskRequest {
  RequestHeader header = 1;
  string task_id = 2;
  UploadKey upload_key = 3;
  EpisodeInfo episode_info = 4;
  string oss_path = 5;      // OSS路径
}

// 停止任务请求
message StopTaskRequest {
  RequestHeader header = 1;
  string task_id = 2;
}

// ============================================
// 机器信息相关消息
// ============================================

// 机器信息请求
message MachineInfoRequest {
  RequestHeader header = 1;
}

// 机器信息响应
message MachineInfoResponse {
  ResponseHeader header = 1;
  string sn_code = 2;
}

// 相机信息
message DcCameraInfo {
  string name = 1;
  int32 fps = 2;
}

// 相机信息列表响应
message CameraInfosRequest {
  RequestHeader header = 1;
}

// 相机信息列表响应
message CameraInfosResponse {
  ResponseHeader header = 1;
  repeated DcCameraInfo cameras = 2;
}

// ============================================
// 上传管理相关消息
// ============================================

// 上传任务状态枚举
enum UploadState {
  UPLOAD_STATE_UNKNOWN = 0;
  UPLOAD_STATE_IDLE = 1;         // 等待中
  UPLOAD_STATE_UPLOADING = 2;    // 上传中
  UPLOAD_STATE_UPLOADED = 3;     // 上传成功
  UPLOAD_STATE_FAILED = 4;       // 上传失败
  UPLOAD_STATE_STOPPED = 5;      // 已停止
}

// 获取上传状态请求
message UploadStatusRequest {
  RequestHeader header = 1;
}

// 获取上传状态响应
message UploadStatusResponse {
  ResponseHeader header = 1;
  bool running = 2;                      // 上传处理器是否运行中
  int32 max_concurrent_uploads = 3;      // 最大上传数
  int32 active_workers = 4;              // 活跃工作数
  int32 queue_size = 5;                  // 队列中等待的任务数
  repeated string processing_tasks = 6;  // 正在处理的任务ID列表
  repeated string completed_tasks = 7;   // 已完成的任务ID列表
  repeated string failed_tasks = 8;      // 失败的任务ID列表
  repeated string stopped_tasks = 9;     // 已停止的任务ID列表
}

// 上传任务详情
message UploadTaskDetail {
  string task_id = 1;
  string status = 2;
  UploadState upload_state = 3;
  int32 retry_count = 4;                 // 重试次数
  string error_message = 5;              // 错误信息
}

// 获取上传任务状态请求
message GetUploadTaskStatusRequest {
  RequestHeader header = 1;
  string task_id = 2;
}

// 获取上传任务状态响应
message UploadTaskStatusResponse {
  ResponseHeader header = 1;
  UploadTaskDetail task = 2;
}

// 停止上传任务请求
message StopUploadTaskRequest {
  RequestHeader header = 1;
  string task_id = 2;
}

// ============================================
// 预览流相关消息
// ============================================

// 开始预览流请求
message StartPreviewRequest {
  RequestHeader header = 1;
  repeated string camera_names = 2;  // 要预览的相机名称列表
}

// 停止预览流请求
message StopPreviewRequest {
  RequestHeader header = 1;
  repeated string camera_names = 2;  // 要停止预览的相机名称列表
}

// 相机帧数据
message CameraFrame {
  string image = 1; // 图片帧
  string image_type = 2; // 相机类型：BASE64_JPG/BASE64_PNG
  string camera_name = 3; // 相机名称
}


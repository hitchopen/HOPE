/**:
  ros__parameters:
    port: 8765
    address: "0.0.0.0"
    tls: false
    # Whitelist keeps camera H.265 / lidar off the Wi-Fi link by default.
    topic_whitelist:
      - "^/tf$"
      - "^/tf_static$"
      - "^/joint_states$"
      - "^/hope/.*"
      - "^/agivslam/localization/odometry$"
    # Match-nothing expressions avoid empty-array type ambiguity in ROS params.
    service_whitelist: ["(?!)"]
    param_whitelist: ["(?!)"]
    client_topic_whitelist: ["(?!)"]
    send_buffer_limit: 10000000
    num_threads: 0
    use_compression: false
    capabilities:
      - connectionGraph

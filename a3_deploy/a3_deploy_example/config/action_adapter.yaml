# Canonical shared ActionAdapter configuration (HOPE, 31-DOF Agibot A3).
#
# This is the ONE file that both the training package and the reference deploy
# runner read, so the raw-action -> joint-target mapping is defined in exactly one
# place. Training loads it directly (whole_body_tracking.utils.action_adapter_config
# resolves this path at task-config time and wires default_q / action_scale / clamp
# into the articulation and action term); there is NO separate training copy.
# Parity is asserted by hope_training/whole_body_tracking/tests/test_action_adapter_parity.py.
#
# Transform (deterministic; not a rejection filter, emits no status):
#     q_des = default_q + raw_action * action_scale
#     q_des = clip(q_des, joint_position_clamp.lower, joint_position_clamp.upper)
#
# Values below are the original stable HOPE A3 starter configuration.
#   * default_q : old HOPE reset/action-offset stand pose.
#   * action_scale : old HOPE per-joint residual scale computed as
#                    0.25 * effort_limit / stiffness.
#   * joint_position_clamp : the A3 model's mechanical joint ranges, used as a
#                    deterministic safety clamp. Vendor hard limits / motor
#                    protection / e-stop remain the robot backend's responsibility.
#
# head_yaw_joint / head_pitch_joint are passive at deploy (held at their default);
# they still occupy their action columns so every vector here is length 31.

action_scale:
  waist_yaw_joint: 0.6470588235294118
  waist_roll_joint: 0.23
  waist_pitch_joint: 0.59
  head_yaw_joint: 0.0375
  head_pitch_joint: 0.0375
  left_shoulder_pitch_joint: 0.375

syntax = "proto3";

package aimdk.protocol;

import "aimdk/protocol/ota/a3/ota_slave/ota_slave_api.proto";

/**
 * @brief OTA Slave Service
 */
service OTASlaveService {
    /**
     * @brief OTA 开始文件上传服务
     */
    rpc OTAStartFileUpload(OTAStartFileUploadRequest) returns (OTAStartFileUploadResponse);

    /**
     * @brief OTA 文件上传服务
     */
    rpc OTAUploadFile(OTAUploadFileRequest) returns (OTAUploadFileResponse);

    /**
     * @brief OTA 结束文件上传服务
     */
    rpc OTAFinishFileUpload(OTAFinishFileUploadRequest) returns (OTAFinishFileUploadResponse);

    /**
     * @brief 开始 OTA 服务
     */
    rpc OTAStart(OTAStartRequest) returns (OTAStartResponse);

    /**
     * @brief 继续 OTA 服务
     */
    rpc OTAContinue(OTAContinueRequest) returns (OTAContinueResponse);

    /**
     * @brief OTA 重试回滚
     */
    rpc OTARetryRollback(OTARetryRollbackRequest) returns (OTARetryRollbackResponse);

    /**
     * @brief 查询当前 OTA 进度
     */
    rpc GetCurrentOTAProcess(GetCurrentOTAProcessRequest) returns (GetCurrentOTAProcessResponse);

    /**
     * @brief 重置 OTA 状态。
     * 
     * @details 在开始文件传输之前，需要查询 OTA 的当前状态。
     * - 当 OTA 处于以下状态时，可以进行状态重置：
     *   - Idle 状态
     *   - Pause 状态
     *   - Failure 状态
     *   - OTAStage_Upgrading_Success 状态
     *   - OTAStage_Rollbacking_Success 状态
     * - 如果 OTA 处于以下状态，ota_master 将持续等待：
     *   - Upgrading 状态
     *   - Rollbacking 状态
     * 
     * @note aima 会重置 ota_master 的状态。
     */
    rpc ResetOTAStatus(ResetOTAStatusRequest) returns (ResetOTAStatusResponse);

    /**
     * @brief 执行 bash 命令
     */
    rpc OTAExecuteBashCommand(OTAExecuteBashCommandRequest) returns (OTAExecuteBashCommandResponse);

    /**
     * @brief OTA调用切换分区的操作
     */
    rpc ActiveOTA(ActiveOTARequest) returns (ActiveOTAResponse);

    /**
     * @brief 开始重启soc节点
     */
    rpc EnableRebootSoc(EnableRebootSocRequest) returns (EnableRebootSocResponse);
}

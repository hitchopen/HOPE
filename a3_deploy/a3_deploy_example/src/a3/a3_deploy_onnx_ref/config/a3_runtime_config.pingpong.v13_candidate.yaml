# Explicit simulation-only candidate config for an evaluated-and-exported RallyV13 model.
#
# This checked-in config does not imply that a V13 model exists or passed Gate3. After
# deterministic eval selects a checkpoint, export it with the RallyV13 metadata contract, stage
# it at the path below, and rebuild. Never repoint this config to a V12 artifact.
onnx:
  model_path: ../../../../assets/a3_runtime/models/model_v13_candidate.onnx
  backend: no_rknn

policy_driver:
  policy_hz: 50.0

obs_debug:
  loc_mode: perfect_tracking

backend:
  aimrt_cfg_path: a3_aimrt_config.pingpong_iceoryx.yaml
  sync_mode: min_skew_pair
  sync_hz: 100.0

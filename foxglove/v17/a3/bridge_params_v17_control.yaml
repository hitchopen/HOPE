/**:
  ros__parameters:
    # Separate, explicitly started control endpoint. The fleet monitor remains
    # on 8765 with its E-stop-only service allowlist. The custom HOPE console
    # uses this one data source for colleague monitor topics plus authoritative
    # V17 Runner/Planner state.
    port: 8766
    address: "0.0.0.0"
    tls: false
    topic_whitelist:
      - "^/tf$"
      - "^/tf_static$"
      - "^/joint_states$"
      - "^/hope/v17/.*"
      - "^/hope/safety/estop_ready$"
      - "^/hope/ntp/(offset_ms|root_dispersion_ms|gate_pass|text)$"
      - "^/hope/clock/(message_latency_ms|message_fresh|message_text)$"
      - "^/hope/system/cpu_load_percent$"
      - "^/hope/vendor/(agibot_pm_active|tf_ready)$"
      - "^/hope/robot_description$"
      - "^/hope/pelvis/(pose|text|scene)$"
    # Exact local-Runner actions, Planner x_hit refresh, and the existing
    # assert-only vendor emergency path. No wildcard service, parameters, or
    # client publishing. The internal flat request topic is not browser-writable.
    service_whitelist:
      - "^/hope/safety/trigger_estop$"
      - "^/hope/v17/refresh_x_hit$"
      - "^/hope/v17/runner/set_server$"
      - "^/hope/v17/runner/set_receiver$"
      - "^/hope/v17/runner/enter_pd_stand$"
      - "^/hope/v17/runner/enter_motion$"
      - "^/hope/v17/runner/emergency_passive$"
      - "^/hope/v17/runner/ready_to_serve$"
      - "^/hope/v17/runner/serve$"
    param_whitelist: ["(?!)"]
    client_topic_whitelist: ["(?!)"]
    send_buffer_limit: 2000000
    num_threads: 0
    use_compression: false
    capabilities:
      - services
      - connectionGraph

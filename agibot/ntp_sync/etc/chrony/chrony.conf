sourcedir /etc/chrony/sources.d
keyfile /etc/chrony/chrony.keys
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony
rtcsync

minsources 2
maxupdateskew 100.0
maxslewrate 100
corrtimeratio 3
logchange 0.1
log tracking statistics

# Leap handling follows the single selected regional source profile.
# Absent by design: makestep, allow, local, and /run/chrony-dhcp.


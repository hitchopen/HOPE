#
# AimRT runtime configuration for A3 deploy on MDU-style local transport.
# Body-drive state/command topics use iceoryx. Teleop also allows ROS2 so
# ROS2 bag playback can still feed /ta/whole_body_command through AimRT's
# ros2_plugin wrapper.

aimrt:
  plugin:
    plugins:
      - name: iceoryx_plugin
        path: libaimrt_iceoryx_plugin.so
        options:
          shm_init_size: 2048
      - name: ros2_plugin
        path: libaimrt_ros2_plugin.so
        options:
          node_name: a3_deploy_onnx_ref
          executor_type: MultiThreaded
          executor_thread_num: 2

  log:
    core_lvl: INFO
    backends:
      - type: console
      - type: rotate_file
        options:
          path: /tmp/a3_deploy_logs
          filename: a3_deploy.log
          max_file_size_m: 32
          max_file_num: 4

  executor:
    executors:
      - name: aimrt_callback_pool
        type: asio_thread
        options:
          thread_num: 2

  channel:
    backends:
      - type: iceoryx
      - type: ros2
        options:
          sub_topics_options:
            - topic_name: "/ta/whole_body_command"
              use_serialized: false
              qos:
                history: keep_last
                depth: 10
                reliability: reliable
                durability: volatile

    pub_topics_options:
      - topic_name: "(.*)"
        enable_backends: [iceoryx]
    sub_topics_options:
      - topic_name: "/ta/whole_body_command"
        enable_backends: [iceoryx, ros2]
      - topic_name: "(.*)"
        enable_backends: [iceoryx]

# PPQ004 is the default for full-physics first-bounce return prediction.
# Fitted parameters live in the referenced YAML files, never in Python/C++ code.
extends: ball_physics_venue.yaml
geometry_yaml: ball_physics.yaml
planner_profile_yaml: ../hope_ws/src/hope_planner_cpp/config/ball_physics_ppq004_20261020.yaml
planner_settings_yaml: ../hope_ws/src/hope_planner_cpp/config/model21800_hardware.yaml
return_physics_yaml: ../hope_ws/src/hope_planner_cpp/config/return_physics.yaml
return_model:
  id: full_ppq004_first_bounce_v1
training_frame:
  near_x: 0.5
  y_center: 0.0
  # surface_z is resolved from geometry_yaml table.height.
provenance:
  model: PPQ004_UNIFIED
  planner_profile: hope_ws/src/hope_planner_cpp/config/ball_physics_ppq004_20261020.yaml
  return_model: full_ppq004_first_bounce_v1
  flight: RK4 with quadratic drag, gravity and Magnus from the selected ball profile.
  paddle: Venue exponential restitution, capped tangential impulse and spin transfer; PPQ004 did not refit the paddle.
  landing: First descending ball-center contact at table surface plus ball radius.
  bank_scope: At-strike incoming states retained; recipe-22 full-physics bank required.

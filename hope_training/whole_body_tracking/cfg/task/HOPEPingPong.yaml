# =============================================================================
# HOPE whole-body task (Agibot A3) — the single training task.
#
# Selected with `task=HOPEPingPong`. Composes the shared env / sim / randomization bases
# (cfg/base/*) and sets the HOPE knobs below. The detailed reward weights, racket-target
# sampling boxes, and domain-randomization defaults live in the environment configuration
# (HOPEPingPongEnvCfg, in the tasks/tracking package) — this file carries only the launcher-level
# knobs and an optional `overrides` map for tuning.
#
# Actor observation: 111-D (contract `hope_pingpong`). Action: 31-D raw joint-position residual.
# Control rate: 50 Hz. Forehand + backhand are learned by one policy (swing_side is an observation).
# =============================================================================

name: HOPEPingPong
gym_task: HOPE-PingPong-AgibotA3-v0
experiment_name: hope_pingpong
actor_obs_contract: hope_pingpong

defaults:
  - /base/env_base@_here_
  - /base/sim_base@_here_
  - /base/randomization_base@_here_
  - _self_

# Reference motion clips (repo-root-relative). These are PLACEHOLDER examples only — short, smooth,
# non-performant synthetic trajectories provided so imports and shape checks pass. Replace them with
# your own recorded forehand / backhand clips (see docs/REPLACE_MOTIONS.md).
#   clip 0 = forehand, clip 1 = backhand. Override on the CLI with motion_file= / motion_file_2=.
motion_file: hope_training/motions/preprocessed/hope_forehand.npz
motion_file_2: hope_training/motions/preprocessed/hope_backhand.npz

env:
  # Long enough to include strike, follow-through, recovery, and the next swing.
  episode_length_s: 10.0

motion:
  # Continuous-rally lifecycle: when a clip wraps, do not teleport onto the next reference frame.
  # This is harder than isolated-swing training, but it is required for MuJoCo/deploy continuous
  # eval where bad postures carry into the next ball.
  wrap_teleport: false

# Optional environment-cfg overrides applied by scripts/train.py as dotted paths onto the parsed
# env cfg. Use this to tune without editing Python. Unknown paths are skipped with a warning.
overrides:
  # Give the policy an explicit ready/recovery window between swings. These are control steps at
  # 50 Hz, so [20, 40] is about 0.4-0.8 s.
  commands.motion.hold_steps_range: [20, 40]
  commands.motion.stand_start_prob: 0.25
  commands.motion.stand_start_min_hold: 30

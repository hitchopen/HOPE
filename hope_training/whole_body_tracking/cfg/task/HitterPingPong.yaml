# Standalone Build task: HitterV11 V14 strike contract plus reviewed recovery/plant deltas.
# The strike problem, actor observation and affine action decoder remain V14-compatible.
defaults:
- /base/env_base@_here_
- /base/sim_base@_here_
- /base/randomization_base@_here_
- _self_
name: HitterPingPong
gym_task: HOPE-HitterPingPong-AgibotA3-v0
experiment_name: agibot_a3_hitter_pingpong
actor_obs_contract: hitter_pure
# Reference motions: pass local clips on the command line —
#   motion_file=<forehand.npz> motion_file_2=<backhand.npz>
# The bundled placeholders under hope_training/motions/preprocessed/ train the
# pipeline end to end; replace them with real swings (docs/REPLACE_MOTIONS.md)
# before training a policy you intend to deploy.
env:
  # Formal Build batch. The permanent 75% core / 12.5% FH / 12.5% BH
  # cohorts therefore contain 4608 / 768 / 768 environments.
  num_envs: 6144
  episode_length_s: 10.0
motion:
  wrap_teleport: false
  stand_start_prob: 0.25
  stand_start_min_hold: 45
  stand_start_yaw_range:
  - -0.6
  - 0.6
  stand_start_yaw_ramp_steps: 96000
  hold_steps_range:
  - 45
  - 60
  hold_long_prob: 0.15
  hold_long_steps_range:
  - 150
  - 300
  post_swing_start_prob: 0.35
  clip_switch_prob: 0.0
  fixed_clip_env_fraction_per_clip: 0.125
  stand_start_x_range:
  - 0.03
  - 0.1
  # Match the actual HitterV11/V14 recovery path.  V14 inherits the 8192-entry
  # legacy ring from V13 and admits only states captured after a complete clip
  # wrap; there are no timed/risk-edge follow-through captures.
  post_swing_replay_contract: legacy_state_v1
  post_swing_buffer_size: 8192
  post_swing_min_fill: 256
  post_swing_capture_phase_bins: 1
  post_swing_capture_severity_bins: 1
  post_swing_risk_edge_capture: false
  post_swing_failure_adaptive: false
  post_swing_min_fill_per_bucket: 1
  post_swing_curriculum_scaled: false
  # Once 256 genuinely completed wraps have filled the legacy bank, the true-reset
  # mass is V14's fixed 0.35.  The independent racket ability gate below controls
  # only mocap corruption and never gates this V14 replay path.
  post_swing_ability_gate_enabled: false
  post_swing_replay_ramp_probabilities: []
  post_swing_min_hold: 45
action:
  contract: v11_affine_safe_qdes_v1
  actual_q_hard_tolerance_rad: 0.002
  # Unitree-aligned training semantics: record/latch actual-q hard-limit evidence, but do not
  # shorten PPO episodes. Any nonzero fault still blocks checkpoint promotion and real deployment.
  actual_q_hard_audit_mode: telemetry
  qdes_delay_min_steps: 0
  qdes_delay_max_steps: 0
  qdes_delay_nominal_fraction: 1.0

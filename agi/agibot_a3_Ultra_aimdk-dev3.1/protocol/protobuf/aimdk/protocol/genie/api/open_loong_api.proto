// DcInitialPose message
message DcInitialPose {
  int32 gs_task_id = 1;              // GenieStudio task ID
  double head_yaw = 2;               // Head yaw angle in degrees
  double head_pitch = 3;             // Head pitch angle in degrees
  double waist_pitch = 4;            // Waist pitch angle in degrees
  int32 arm = 5;                     // Arm position: 0=BOTH_SIDES, 1=RAISED
  double torque = 6;                 // 抓握力
}

// ==================== /pose/set (POST) ====================

message SetDcInitialPoseRequest {
  RequestHeader header = 1;
  DcInitialPose dc_initial_pose = 2;
}

// ==================== /pose/get (GET) ====================

message GetDcInitialPoseRequest {
  RequestHeader header = 1;
  optional int32 gs_task_id = 2;     // Optional GenieStudio task ID
}

message GetDcInitialPoseResponse {
  ResponseHeader header = 1;
  DcInitialPose dc_initial_pose = 2;
}

// ==================== /pose/reset (POST) ====================

message ResetDcInitialPoseRequest {
  RequestHeader header = 1;
  int32 gs_task_id = 2;
}

message ResetDcInitialPoseResponse {
  ResponseHeader header = 1;
  DcInitialPose dc_initial_pose = 2;
}

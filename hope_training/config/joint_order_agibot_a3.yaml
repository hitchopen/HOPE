# Agibot A3 controllable joint order (31 DOF).
# Source: order of <joint> hinges in GMR/assets/agibot_a3/a3_mocap.xml,
# which is the order GMR writes dof_pos and the order training/ONNX/SDK must share.
# VERIFY against the real A3 SDK (`ros2 topic echo /joint_states --once`) before deployment.
# count: 31
joint_order:
  - waist_yaw_joint
  - waist_roll_joint
  - waist_pitch_joint
  - head_yaw_joint
  - head_pitch_joint
  - left_shoulder_pitch_joint
  - left_shoulder_roll_joint
  - left_shoulder_yaw_joint
  - left_elbow_joint
  - left_wrist_roll_joint
  - left_wrist_pitch_joint
  - left_wrist_yaw_joint
  - right_shoulder_pitch_joint
  - right_shoulder_roll_joint
  - right_shoulder_yaw_joint
  - right_elbow_joint
  - right_wrist_roll_joint
  - right_wrist_pitch_joint
  - right_wrist_yaw_joint
  - left_hip_pitch_joint
  - left_hip_roll_joint
  - left_hip_yaw_joint
  - left_knee_joint
  - left_ankle_pitch_joint
  - left_ankle_roll_joint
  - right_hip_pitch_joint
  - right_hip_roll_joint
  - right_hip_yaw_joint
  - right_knee_joint
  - right_ankle_pitch_joint
  - right_ankle_roll_joint
